name: 일일 main 수집 예약

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: main의 수집 및 Pages 배포 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
