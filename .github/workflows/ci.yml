name: 품질 검사

on:
  pull_request:
    branches: [develop, main]
  push:
    branches-ignore: [chore/crawl-state]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /Military-Job-Finder
          NEXT_TELEMETRY_DISABLED: '1'
